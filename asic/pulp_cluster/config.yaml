# clocks are defined in cons.sdc
#------------------SYNTHESIS-----------------------

RUN_LINTER: false
# not to stop flow on synthesis warnings
# checked most of the warnings and they are not critical, so we can ignore them
# Checker.YosysSynthChecks.
ERROR_ON_SYNTH_CHECKS: false
#flatten
SYNTH_HIERARCHY_MODE: 'flatten'

#generate nl.dot file
SYNTH_SHOW: true

USE_SLANG: true
SLANG_ARGUMENTS:
  - "--ignore-assertions"
  # - "-Wno-unconnected-port"
  # - "--keep-hierarchy"

#not yet sure of its performance
# RUN_EQY: true

#--------------------
# strategy  gatecount   min period   
# AREA 3  : 510499      57.62
# DELAY 0 : 414917      55.48
# DELAY 4 : 390886      64.63
# other stratigies cause OOM kills during synthesis
SYNTH_STRATEGY: 'DELAY 0' 

# doesn't seem to work along with SLANG 
#SYNTH_KEEP_HIERARCHY_MIN_COST: 5000 
# SYNTH_SHARE_RESOURCES: False

# takes massive memory drains both mem and swap and much longer nets names so it results in bigger netlist x2~5 times larger
# but it overcomes the problem of renaming intermediate wires as _123_ and so on which is terible for debbuging
# SYNTH_AUTONAME: true

SYNTH_SIZING: true
#enable abc cell buffering
SYNTH_ABC_BUFFERING: true

#--------------------------------------------------------------
PNR_SDC_FILE: dir::cons_pre_pnr.sdc

SIGNOFF_SDC_FILE: dir::cons_pnr.sdc

#-----------------PNR-----------------------
FP_CORE_UTIL: 40
RT_MAX_LAYER: met4
PDN_MULTILAYER: false
#-----------------STA-----------------------
# Run multi-corner STA only at the slowest (setup-dominant) corners
#only for syn exploration so the resource usage is not too high, for final signoff we will run all corners
#STA_CORNERS:
#  - max_tt_025C_1v80
#  - max_ss_100C_1v60
#  - max_ff_n40C_1v95
# all 9 corners cause OOM kills
# this limits number of parallel process to 3 typically each process need ~5 GB of RAM
STA_THREADS: 3
#-----------power pins----------------
VERILOG_POWER_DEFINE: "USE_POWER_PINS"
#--------------------------MACRO--------------------------------------

# Hardened OpenRAM macro for TCDM banks (1024x32, 1RW).
# LEF MACRO name is sram_32x1024; 16 banks flatten to
# cluster_i.tcdm_banks_i.banks_gen[N].i_bank.u_sram (dot-notation, unescaped
# brackets). Views live in asic/SRAM_32x1024/macro/.

MACROS:
  sram_32x1024:
    instances:
      cluster_i.tcdm_banks_i.banks_gen[0].i_bank.u_sram: {orientation: N}
      cluster_i.tcdm_banks_i.banks_gen[1].i_bank.u_sram: {orientation: N}
      cluster_i.tcdm_banks_i.banks_gen[2].i_bank.u_sram: {orientation: N}
      cluster_i.tcdm_banks_i.banks_gen[3].i_bank.u_sram: {orientation: N}
      cluster_i.tcdm_banks_i.banks_gen[4].i_bank.u_sram: {orientation: N}
      cluster_i.tcdm_banks_i.banks_gen[5].i_bank.u_sram: {orientation: N}
      cluster_i.tcdm_banks_i.banks_gen[6].i_bank.u_sram: {orientation: N}
      cluster_i.tcdm_banks_i.banks_gen[7].i_bank.u_sram: {orientation: N}
      cluster_i.tcdm_banks_i.banks_gen[8].i_bank.u_sram: {orientation: N}
      cluster_i.tcdm_banks_i.banks_gen[9].i_bank.u_sram: {orientation: N}
      cluster_i.tcdm_banks_i.banks_gen[10].i_bank.u_sram: {orientation: N}
      cluster_i.tcdm_banks_i.banks_gen[11].i_bank.u_sram: {orientation: N}
      cluster_i.tcdm_banks_i.banks_gen[12].i_bank.u_sram: {orientation: N}
      cluster_i.tcdm_banks_i.banks_gen[13].i_bank.u_sram: {orientation: N}
      cluster_i.tcdm_banks_i.banks_gen[14].i_bank.u_sram: {orientation: N}
      cluster_i.tcdm_banks_i.banks_gen[15].i_bank.u_sram: {orientation: N}
    gds:
      - dir::../SRAM_32x1024/macro/sram_32x1024.gds
    lef:
      - dir::../SRAM_32x1024/macro/sram_32x1024.lef
    nl:
      - dir::../SRAM_32x1024/macro/sram_32x1024.v
    lib:
      min_*: [dir::../SRAM_32x1024/macro/sram_32x1024_TT_1p8V_25C.lib]
      nom_*: [dir::../SRAM_32x1024/macro/sram_32x1024_TT_1p8V_25C.lib]
      max_*: [dir::../SRAM_32x1024/macro/sram_32x1024_TT_1p8V_25C.lib]
    spef: {}
    spice: []
    sdf: {}
  core_region_wrap:
    # Hardened core region macro (LEF MACRO core_region_wrap). Its netlist keeps
    # core_id_i as an input port, so it can stand in for every core instance of
    # the generate block: cluster_i.CORE[0..7].core_region_i (NB_CORES=8).
    instances:
      cluster_i.CORE[0].core_region_i: {orientation: N}
      cluster_i.CORE[1].core_region_i: {orientation: N}
      cluster_i.CORE[2].core_region_i: {orientation: N}
      cluster_i.CORE[3].core_region_i: {orientation: N}
      cluster_i.CORE[4].core_region_i: {orientation: N}
      cluster_i.CORE[5].core_region_i: {orientation: N}
      cluster_i.CORE[6].core_region_i: {orientation: N}
      cluster_i.CORE[7].core_region_i: {orientation: N}
    gds:
      - dir::core_macro/gds/core_region_wrap.gds
    lef:
      - dir::core_macro/lef/core_region_wrap.lef

    json_h: dir::core_macro/json_h/core_region_wrap.h.json

    nl:
      - dir::core_macro/nl/core_region_wrap.nl.v
    # Powered netlist: has `inout power/ground` ports. LibreLane prefers this
    # view over nl whenever power defines (USE_POWER_PINS) are active
    # (synthesis, jsonheader, netgen LVS, SDF netlists).
    pnl:
      - dir::core_macro/pnl/core_region_wrap.pnl.v
    lib:
      # Multi-corner characterized views from core_macro/
      
      min_tt_*: [dir::core_macro/lib/min_tt_025C_1v80/core_region_wrap__min_tt_025C_1v80.lib]
      nom_tt_*: [dir::core_macro/lib/nom_tt_025C_1v80/core_region_wrap__nom_tt_025C_1v80.lib]
      max_tt_*: [dir::core_macro/lib/max_tt_025C_1v80/core_region_wrap__max_tt_025C_1v80.lib]

      min_ss_*: [dir::core_macro/lib/min_ss_100C_1v60/core_region_wrap__min_ss_100C_1v60.lib]
      nom_ss_*: [dir::core_macro/lib/nom_ss_100C_1v60/core_region_wrap__nom_ss_100C_1v60.lib]
      max_ss_*: [dir::core_macro/lib/max_ss_100C_1v60/core_region_wrap__max_ss_100C_1v60.lib]

      min_ff_*: [dir::core_macro/lib/min_ff_n40C_1v95/core_region_wrap__min_ff_n40C_1v95.lib]
      nom_ff_*: [dir::core_macro/lib/nom_ff_n40C_1v95/core_region_wrap__nom_ff_n40C_1v95.lib]
      max_ff_*: [dir::core_macro/lib/max_ff_n40C_1v95/core_region_wrap__max_ff_n40C_1v95.lib]
    spef: 
      min_*: [dir::core_macro/spef/min/core_region_wrap.min.spef]
      nom_*: [dir::core_macro/spef/nom/core_region_wrap.nom.spef]
      max_*: [dir::core_macro/spef/max/core_region_wrap.max.spef]
    spice: [dir::core_macro/spice/core_region_wrap.spice]
    # Corner-matched SDF delays from core_macro/
    sdf:
      min_tt_*: [dir::core_macro/sdf/min_tt_025C_1v80/core_region_wrap__min_tt_025C_1v80.sdf]
      nom_tt_*: [dir::core_macro/sdf/nom_tt_025C_1v80/core_region_wrap__nom_tt_025C_1v80.sdf]
      max_tt_*: [dir::core_macro/sdf/max_tt_025C_1v80/core_region_wrap__max_tt_025C_1v80.sdf]

      min_ss_*: [dir::core_macro/sdf/min_ss_100C_1v60/core_region_wrap__min_ss_100C_1v60.sdf]
      nom_ss_*: [dir::core_macro/sdf/nom_ss_100C_1v60/core_region_wrap__nom_ss_100C_1v60.sdf]
      max_ss_*: [dir::core_macro/sdf/max_ss_100C_1v60/core_region_wrap__max_ss_100C_1v60.sdf]

      min_ff_*: [dir::core_macro/sdf/min_ff_n40C_1v95/core_region_wrap__min_ff_n40C_1v95.sdf]
      nom_ff_*: [dir::core_macro/sdf/nom_ff_n40C_1v95/core_region_wrap__nom_ff_n40C_1v95.sdf]
      max_ff_*: [dir::core_macro/sdf/max_ff_n40C_1v95/core_region_wrap__max_ff_n40C_1v95.sdf]


# Keep rows/taps out of the macro boundary (808.8 x 351.3 um OpenRAM block).
FP_MACRO_HORIZONTAL_HALO: 10
FP_MACRO_VERTICAL_HALO: 10



